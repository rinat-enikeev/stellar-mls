name: F-Droid Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deterministic APK in Docker
        run: |
          chmod +x scripts/build-fdroid-release.sh
          ./scripts/build-fdroid-release.sh

      - name: Zipalign APK (match F-Droid reproducible-apk-tools padding)
        run: |
          pip install repro-apk
          APK=$(ls app-fdroid-arm64-v8a-release-*.apk)
          mv "$APK" unaligned.apk
          repro-apk zipalign --page-size 16 --pad-like-apksigner --replace unaligned.apk "$APK"
          rm -f unaligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | sort -V | tail -1)
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            app-fdroid-arm64-v8a-release-*.apk
          rm /tmp/keystore.jks

      - name: Generate release notes from commits
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          # Build changelog from commit messages
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: app-fdroid-arm64-v8a-release-*.apk
