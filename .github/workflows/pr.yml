name: PR Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-rust-tests-${{ hashFiles('Cargo.lock') }}

      # Default-features build + tests — the legacy Groth16 path the
      # mobile clients and existing contracts already depend on.
      - name: Default-features tests
        run: cargo test --lib --release commitment::tests

      # PLONK feature build + the SRS round-trip tests. Catches any
      # drift in the embedded EF KZG SRS bytes, the v0.5 deserialiser,
      # the pairing identity, and the test-SRS round trip — all of
      # which are gated behind `feature = "plonk"` and would otherwise
      # never run in CI.
      - name: PLONK feature SRS tests
        run: cargo test --no-default-features --features groth16,plonk,std,jni,ffi --lib --release prover::srs::tests

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27c
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-linux-android
          key: pr-android-rust-${{ hashFiles('Cargo.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pr-android-gradle-${{ hashFiles('clients/android/StellarChat/**/*.gradle*', 'clients/android/StellarChat/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Build Rust library for Android (arm64-v8a)
        run: ./scripts/build-android.sh --out-dir kotlin-mls/src/main --abis arm64-v8a

      - name: Remove google-services.json (fdroid flavor)
        run: rm -f clients/android/StellarChat/app/google-services.json

      - name: Build unsigned fdroid debug APK
        working-directory: clients/android/StellarChat
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleFdroidDebug --no-daemon --stacktrace

  ios-build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
          key: pr-ios-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build Rust library for iOS
        run: cargo build --release --target aarch64-apple-ios

      - name: Create XCFramework (iOS device only)
        run: |
          mkdir -p build/staging/ios
          cp target/aarch64-apple-ios/release/libsep_xxxx_circuits.a build/staging/ios/
          strip -S build/staging/ios/libsep_xxxx_circuits.a
          xcodebuild -create-xcframework \
            -library build/staging/ios/libsep_xxxx_circuits.a \
            -headers swift-mls/Sources/CSEPMLSFFI/include \
            -output build/SEPMLSFFI.xcframework

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Pre-generate RelayerDefaults for xcodegen
        run: |
          ENV_FILE="relayer/.env"
          ROOT_ENV=".env"
          OUT="clients/ios/StellarChat/StellarChat/RelayerDefaults.generated.swift"
          EP=""; CID=""; BIND=""; AUTH=""; DOMAIN=""
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                RELAYER_RPC_URL) EP="$val" ;;
                RELAYER_CONTRACT_ID) CID="$val" ;;
                RELAYER_BIND) BIND="$val" ;;
                RELAYER_AUTH_TOKENS) AUTH="${val%%,*}" ;;
              esac
            done < "$ENV_FILE"
          fi
          if [ -f "$ROOT_ENV" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                DOMAIN) DOMAIN="$val" ;;
              esac
            done < "$ROOT_ENV"
          fi
          NOSTR=""; BLOSSOM=""; RELAY=""
          if [ -n "$DOMAIN" ]; then
            NOSTR="wss://nostr.$DOMAIN"
            BLOSSOM="https://blossom.$DOMAIN"
            RELAY="https://relay.$DOMAIN"
          elif [ -n "$BIND" ]; then
            RELAY="http://$BIND"
          fi
          cat > "$OUT" << SWIFT
          // Auto-generated from .env + relayer/.env — do not edit
          enum RelayerDefaults {
              static let contractEndpoint = "$EP"
              static let contractID = "$CID"
              static let relayerURL = "$RELAY"
              static let relayerAuthToken = "$AUTH"
              static let defaultNostrRelay = "$NOSTR"
              static let defaultBlossomServer = "$BLOSSOM"
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/StellarChat
        run: xcodegen generate

      - name: Build iOS app (unsigned)
        working-directory: clients/ios/StellarChat
        run: |
          xcodebuild build \
            -project StellarChat.xcodeproj \
            -scheme StellarChat \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/StellarChat-PR-DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
