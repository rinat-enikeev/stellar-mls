# Release ceremony_tool binaries.
#
# Phase A scope: Linux (x86_64, aarch64) + macOS (x86_64, aarch64), unsigned,
# with SHA-256 checksums and optional minisign signatures when the
# MINISIGN_SECRET_KEY secret is set. Phase B adds cosign keyless + SLSA.
# Phase C adds Windows (x86_64, unsigned + minisig) and documents Azure
# Trusted Signing as the v2 path; macOS notarization still pending.
#
# Trigger: manual dispatch (matches project convention that
# "releases require `gh workflow run Release -f tag=vX.Y.Z`").

name: Release ceremony_tool

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v0.1.0). Must already exist.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          # macos-13 is retired from GitHub-hosted runners. macos-15-intel
          # is the current Intel-silicon label (same toolchain family, same
          # target triple output).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    env:
      # Reproducible build knobs.
      SOURCE_DATE_EPOCH: "0"
      TZ: UTC
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Compute SOURCE_DATE_EPOCH from commit
        shell: bash
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"

      - name: Install rust-toolchain.toml components
        uses: dtolnay/rust-toolchain@master
        with:
          # The pinned channel is read from rust-toolchain.toml at checkout.
          # dtolnay/rust-toolchain honors it when set to "stable" here.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Ensure pinned toolchain has the matrix target
        shell: bash
        run: |
          # dtolnay/rust-toolchain installed `stable` + the target, but
          # rust-toolchain.toml pins a specific channel (e.g. 1.88.0) that
          # auto-installs on first cargo invocation without the target.
          # Force-install the target against the pinned channel here.
          rustup target add ${{ matrix.target }}

      - name: Install musl cross tools (Linux)
        if: matrix.cross
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-musl)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              mkdir -p ~/.cargo
              cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF
              ;;
          esac

      - name: Cargo build (release-ceremony profile)
        shell: bash
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build
        run: |
          cargo build \
            --locked \
            --profile release-ceremony \
            --target ${{ matrix.target }} \
            --bin ceremony_tool

      - name: Stage artifact
        id: package
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          case "${{ matrix.target }}" in *windows*) EXT=".exe";; esac
          SRC=target/${{ matrix.target }}/release-ceremony/ceremony_tool${EXT}
          test -f "$SRC"
          NAME=ceremony_tool-${{ inputs.tag }}-${{ matrix.target }}${EXT}
          cp "$SRC" dist/$NAME
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"

      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$APPLE_DEVELOPER_ID" ] || [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "Apple signing secrets not set — skipping notarization"
            exit 0
          fi
          scripts/sign-macos.sh dist/${{ steps.package.outputs.name }}

      - name: Compute SHA-256
        shell: bash
        run: |
          NAME=${{ steps.package.outputs.name }}
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum $NAME > $NAME.sha256)
          else
            (cd dist && shasum -a 256 $NAME > $NAME.sha256)
          fi

      - name: Write buildinfo.json
        shell: bash
        run: |
          NAME=${{ steps.package.outputs.name }}
          RUSTC=$(rustc --version)
          COMMIT=$(git rev-parse HEAD)
          if command -v sha256sum >/dev/null 2>&1; then
            SHA=$(sha256sum dist/$NAME | awk '{print $1}')
          else
            SHA=$(shasum -a 256 dist/$NAME | awk '{print $1}')
          fi
          cat > dist/$NAME.buildinfo.json <<EOF
          {
            "name": "$NAME",
            "tag": "${{ inputs.tag }}",
            "target": "${{ matrix.target }}",
            "commit": "$COMMIT",
            "rustc": "$RUSTC",
            "source_date_epoch": "$SOURCE_DATE_EPOCH",
            "sha256": "$SHA",
            "notarized": ${{ runner.os == 'macOS' && secrets.APPLE_DEVELOPER_ID != '' && 'true' || 'false' }}
          }
          EOF

      - name: Minisign (optional)
        env:
          MINISIGN_SECRET_KEY_BASE64: ${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MINISIGN_SECRET_KEY_BASE64" ]; then
            echo "minisign secret not set — skipping signature"
            exit 0
          fi
          # Install minisign per OS. On Windows we use the prebuilt binary
          # from jedisct1/minisign release tree; choco/scoop are slower and
          # add non-deterministic state to the runner image.
          case "$(uname -s)" in
            Darwin*)
              brew install minisign
              ;;
            Linux*)
              sudo apt-get update -y && sudo apt-get install -y minisign
              ;;
            MINGW*|MSYS*|CYGWIN*)
              curl -sSLfO https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip
              7z x minisign-0.11-win64.zip -ominisign-dist
              echo "$(pwd)/minisign-dist/minisign-win64" >> "$GITHUB_PATH"
              export PATH="$(pwd)/minisign-dist/minisign-win64:$PATH"
              ;;
          esac
          mkdir -p ~/.minisign
          # Strip whitespace — GNU base64 (Linux) rejects embedded newlines
          # by default; macOS/BSD base64 tolerates them. Secrets pasted
          # from `base64 -i key` without `tr -d '\n'` carry 76-col wraps.
          printf '%s' "$MINISIGN_SECRET_KEY_BASE64" | tr -d ' \t\r\n' | base64 -d > ~/.minisign/sk
          if [ ! -s ~/.minisign/sk ]; then
            echo "decoded minisign secret is empty — check MINISIGN_SECRET_KEY_BASE64" >&2
            exit 1
          fi
          NAME=${{ steps.package.outputs.name }}
          echo "$MINISIGN_PASSWORD" | minisign -Sm dist/$NAME -s ~/.minisign/sk -c "ceremony_tool ${{ inputs.tag }} / ${{ matrix.target }}"
          rm -f ~/.minisign/sk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}*
          if-no-files-found: error

  build-macos-gui:
    name: build macOS GUI .dmg
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download macOS CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli-dist
          merge-multiple: true
          pattern: ceremony_tool-${{ inputs.tag }}-*-apple-darwin

      - name: Sanity-check CLI inputs
        shell: bash
        run: |
          ls -la cli-dist/
          test -f "cli-dist/ceremony_tool-${{ inputs.tag }}-aarch64-apple-darwin"
          test -f "cli-dist/ceremony_tool-${{ inputs.tag }}-x86_64-apple-darwin"
          chmod +x "cli-dist/ceremony_tool-${{ inputs.tag }}-aarch64-apple-darwin" \
                   "cli-dist/ceremony_tool-${{ inputs.tag }}-x86_64-apple-darwin"

      - name: Build + sign + notarize + staple .dmg
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$APPLE_DEVELOPER_ID" ] || [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "Apple signing secrets not set — cannot build notarized .app." >&2
            echo "Set APPLE_DEVELOPER_ID + APPLE_CERT_P12_BASE64 in repo secrets." >&2
            exit 1
          fi
          # Strip the leading "v" so VERSION='1.5.5' matches CFBundleShortVersionString rules.
          VER="${{ inputs.tag }}"; VER="${VER#v}"
          mkdir -p dist
          clients/mac-ceremony/build.sh \
            --version "$VER" \
            --x86_64  "cli-dist/ceremony_tool-${{ inputs.tag }}-x86_64-apple-darwin" \
            --arm64   "cli-dist/ceremony_tool-${{ inputs.tag }}-aarch64-apple-darwin" \
            --out     dist
          # Rename to the tag-prefixed convention used by the manifest builder.
          mv "dist/CeremonyTool-${VER}.dmg"        "dist/CeremonyTool-${{ inputs.tag }}.dmg"
          mv "dist/CeremonyTool-${VER}.dmg.sha256" "dist/CeremonyTool-${{ inputs.tag }}.dmg.sha256"
          # Rewrite the inner filename in the .sha256 so `shasum -c` still works.
          sed -i '' "s|CeremonyTool-${VER}.dmg|CeremonyTool-${{ inputs.tag }}.dmg|g" \
            "dist/CeremonyTool-${{ inputs.tag }}.dmg.sha256"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeremonyTool-${{ inputs.tag }}.dmg
          path: dist/CeremonyTool-${{ inputs.tag }}.dmg*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, build-macos-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build ceremony-downloads.json
        shell: bash
        run: |
          # Read pubkey from the committed file if present; the manifest
          # will carry null otherwise, which the download page handles.
          PUB=""
          if [ -f .minisign/ceremony-tool.pub ]; then
            PUB=$(tail -1 .minisign/ceremony-tool.pub)
          fi
          MINISIGN_PUBKEY="$PUB" python3 scripts/update-ceremony-downloads.py \
            --tag "${{ inputs.tag }}" \
            --dist-dir dist \
            --out dist/ceremony-downloads.json

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
