name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md

  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-android-test-gradle-${{ hashFiles('clients/android/StellarChat/**/*.gradle*', 'clients/android/StellarChat/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Remove google-services.json (fdroid flavor)
        run: rm -f clients/android/StellarChat/app/google-services.json

      - name: Run JVM unit tests
        working-directory: clients/android/StellarChat
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:testFdroidDebugUnitTest --no-daemon --stacktrace

  ios-test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
            target/aarch64-apple-ios-sim
            target/aarch64-apple-darwin
          key: release-ios-test-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build XCFramework (device + simulator + macOS slices)
        run: ./scripts/build-xcframework.sh

      - name: Test swift-mls package
        run: swift test --package-path swift-mls

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Pre-generate RelayerDefaults for xcodegen
        run: |
          ENV_FILE="relayer/.env"
          ROOT_ENV=".env"
          OUT="clients/ios/StellarChat/StellarChat/RelayerDefaults.generated.swift"
          EP=""; CID=""; BIND=""; AUTH=""; DOMAIN=""
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                RELAYER_RPC_URL) EP="$val" ;;
                RELAYER_CONTRACT_ID) CID="$val" ;;
                RELAYER_BIND) BIND="$val" ;;
                RELAYER_AUTH_TOKENS) AUTH="${val%%,*}" ;;
              esac
            done < "$ENV_FILE"
          fi
          if [ -f "$ROOT_ENV" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                DOMAIN) DOMAIN="$val" ;;
              esac
            done < "$ROOT_ENV"
          fi
          NOSTR=""; BLOSSOM=""; RELAY=""
          if [ -n "$DOMAIN" ]; then
            NOSTR="wss://nostr.$DOMAIN"
            BLOSSOM="https://blossom.$DOMAIN"
            RELAY="https://relay.$DOMAIN"
          elif [ -n "$BIND" ]; then
            RELAY="http://$BIND"
          fi
          cat > "$OUT" << SWIFT
          // Auto-generated from .env + relayer/.env — do not edit
          enum RelayerDefaults {
              static let contractEndpoint = "$EP"
              static let contractID = "$CID"
              static let relayerURL = "$RELAY"
              static let relayerAuthToken = "$AUTH"
              static let defaultNostrRelay = "$NOSTR"
              static let defaultBlossomServer = "$BLOSSOM"
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/StellarChat
        run: xcodegen generate

      - name: Pick iOS Simulator destination
        id: sim
        run: |
          # Pick the newest available iPhone simulator name; fail loud if none.
          NAME=$(xcrun simctl list devicetypes iphone --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devicetypes']; \
                         names=[x['name'] for x in d if 'iPhone' in x['name']]; \
                         print(names[-1] if names else '', end='')")
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator devicetype available on runner" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test StellarChat
        working-directory: clients/ios/StellarChat
        run: |
          xcodebuild test \
            -project StellarChat.xcodeproj \
            -scheme StellarChat \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            -derivedDataPath /tmp/stellar-chat-release-test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  android-build:
    runs-on: ubuntu-latest
    needs: [create-release, android-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build deterministic APK in Docker
        run: |
          chmod +x scripts/build-fdroid-release.sh
          ./scripts/build-fdroid-release.sh

      - name: Zipalign APK
        run: |
          pip install repro-apk
          APK=$(ls app-fdroid-arm64-v8a-release-*.apk)
          mv "$APK" unaligned.apk
          repro-apk zipalign --page-size 16 --pad-like-apksigner --replace unaligned.apk "$APK"
          rm -f unaligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | sort -V | tail -1)
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            app-fdroid-arm64-v8a-release-*.apk
          rm /tmp/keystore.jks

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: app-fdroid-arm64-v8a-release-*.apk

  ios-build:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [create-release, ios-test]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
          key: ios-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build Rust library for iOS
        run: cargo build --release --target aarch64-apple-ios

      - name: Create XCFramework (iOS device only)
        run: |
          mkdir -p build/staging/ios
          cp target/aarch64-apple-ios/release/libsep_xxxx_circuits.a build/staging/ios/
          strip -S build/staging/ios/libsep_xxxx_circuits.a
          xcodebuild -create-xcframework \
            -library build/staging/ios/libsep_xxxx_circuits.a \
            -headers swift-mls/Sources/CSEPMLSFFI/include \
            -output build/SEPMLSFFI.xcframework

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Pre-generate RelayerDefaults for xcodegen
        run: |
          ENV_FILE="relayer/.env"
          ROOT_ENV=".env"
          OUT="clients/ios/StellarChat/StellarChat/RelayerDefaults.generated.swift"
          EP=""; CID=""; BIND=""; AUTH=""; DOMAIN=""
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                RELAYER_RPC_URL) EP="$val" ;;
                RELAYER_CONTRACT_ID) CID="$val" ;;
                RELAYER_BIND) BIND="$val" ;;
                RELAYER_AUTH_TOKENS) AUTH="${val%%,*}" ;;
              esac
            done < "$ENV_FILE"
          fi
          if [ -f "$ROOT_ENV" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                DOMAIN) DOMAIN="$val" ;;
              esac
            done < "$ROOT_ENV"
          fi
          NOSTR=""; BLOSSOM=""; RELAY=""
          if [ -n "$DOMAIN" ]; then
            NOSTR="wss://nostr.$DOMAIN"
            BLOSSOM="https://blossom.$DOMAIN"
            RELAY="https://relay.$DOMAIN"
          elif [ -n "$BIND" ]; then
            RELAY="http://$BIND"
          fi
          cat > "$OUT" << SWIFT
          // Auto-generated from .env + relayer/.env — do not edit
          enum RelayerDefaults {
              static let contractEndpoint = "$EP"
              static let contractID = "$CID"
              static let relayerURL = "$RELAY"
              static let relayerAuthToken = "$AUTH"
              static let defaultNostrRelay = "$NOSTR"
              static let defaultBlossomServer = "$BLOSSOM"
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/StellarChat
        run: xcodegen generate

      - name: Configure SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF

      - name: Install Fastlane
        working-directory: clients
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build, upload to TestFlight, and export ad-hoc IPA
        working-directory: clients
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_TEAM_ID: ${{ secrets.MATCH_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bundle exec fastlane ios release

      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mv clients/build/ios/adhoc/StellarChat.ipa "StellarChat-${VERSION}.ipa"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: StellarChat-${{ steps.version.outputs.version }}.ipa

  update-altstore:
    runs-on: ubuntu-latest
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update AltStore source JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          IPA_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/StellarChat-${VERSION}.ipa"
          IPA_SIZE=$(gh release view "$TAG" --json assets -q ".assets[] | select(.name | endswith(\".ipa\")) | .size")

          python3 -c "
          import json
          from datetime import date

          with open('deploy/website/altstore-source.json') as f:
              source = json.load(f)

          versions = source['apps'][0]['versions']
          versions = [v for v in versions if v.get('version') != '${VERSION}']
          versions.insert(0, {
              'version': '${VERSION}',
              'date': date.today().isoformat(),
              'localizedDescription': 'Release ${VERSION}',
              'downloadURL': '${IPA_URL}',
              'size': int('${IPA_SIZE}' or '0'),
          })
          source['apps'][0]['versions'] = versions

          with open('deploy/website/altstore-source.json', 'w') as f:
              json.dump(source, f, indent=2)
              f.write('\n')
          "

      - name: Commit AltStore update
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/website/altstore-source.json
          git diff --cached --quiet && exit 0
          git commit -m "Update AltStore source for ${TAG}"
          git push
