name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md

  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-android-test-gradle-${{ hashFiles('clients/android/StellarChat/**/*.gradle*', 'clients/android/StellarChat/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Remove google-services.json (fdroid flavor)
        run: rm -f clients/android/StellarChat/app/google-services.json

      - name: Run JVM unit tests
        working-directory: clients/android/StellarChat
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:testFdroidDebugUnitTest --no-daemon --stacktrace

  ios-test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
            target/aarch64-apple-ios-sim
            target/aarch64-apple-darwin
          key: release-ios-test-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build XCFramework (device + simulator + macOS slices)
        run: ./scripts/build-xcframework.sh

      - name: Test swift-mls package
        run: swift test --package-path swift-mls

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Pre-generate RelayerDefaults for xcodegen
        run: |
          ENV_FILE="relayer/.env"
          ROOT_ENV=".env"
          OUT="clients/ios/StellarChat/StellarChat/RelayerDefaults.generated.swift"
          EP=""; CID=""; BIND=""; AUTH=""; DOMAIN=""
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                RELAYER_RPC_URL) EP="$val" ;;
                RELAYER_CONTRACT_ID) CID="$val" ;;
                RELAYER_BIND) BIND="$val" ;;
                RELAYER_AUTH_TOKENS) AUTH="${val%%,*}" ;;
              esac
            done < "$ENV_FILE"
          fi
          if [ -f "$ROOT_ENV" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                DOMAIN) DOMAIN="$val" ;;
              esac
            done < "$ROOT_ENV"
          fi
          NOSTR=""; BLOSSOM=""; RELAY=""
          if [ -n "$DOMAIN" ]; then
            NOSTR="wss://nostr.$DOMAIN"
            BLOSSOM="https://blossom.$DOMAIN"
            RELAY="https://relay.$DOMAIN"
          elif [ -n "$BIND" ]; then
            RELAY="http://$BIND"
          fi
          cat > "$OUT" << SWIFT
          // Auto-generated from .env + relayer/.env — do not edit
          enum RelayerDefaults {
              static let contractEndpoint = "$EP"
              static let contractID = "$CID"
              static let relayerURL = "$RELAY"
              static let relayerAuthToken = "$AUTH"
              static let defaultNostrRelay = "$NOSTR"
              static let defaultBlossomServer = "$BLOSSOM"
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/StellarChat
        run: xcodegen generate

      - name: Pick iOS Simulator destination
        id: sim
        run: |
          # Pick an existing iPhone simulator device (devicetypes list includes
          # retired models with no created simulator). Fail loud if none.
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                         names=[dev['name'] for runtime,devs in d.items() \
                                if 'iOS' in runtime \
                                for dev in devs if 'iPhone' in dev['name']]; \
                         print(names[-1] if names else '', end='')")
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator device available on runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test StellarChat
        working-directory: clients/ios/StellarChat
        run: |
          xcodebuild test \
            -project StellarChat.xcodeproj \
            -scheme StellarChat \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            -derivedDataPath /tmp/stellar-chat-release-test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  android-build:
    runs-on: ubuntu-latest
    needs: [create-release, android-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build deterministic APK in Docker
        run: |
          chmod +x scripts/build-fdroid-release.sh
          ./scripts/build-fdroid-release.sh

      - name: Zipalign APK
        run: |
          pip install repro-apk
          APK=$(ls app-fdroid-arm64-v8a-release-*.apk)
          mv "$APK" unaligned.apk
          repro-apk zipalign --page-size 16 --pad-like-apksigner --replace unaligned.apk "$APK"
          rm -f unaligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | sort -V | tail -1)
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            app-fdroid-arm64-v8a-release-*.apk
          rm /tmp/keystore.jks

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: app-fdroid-arm64-v8a-release-*.apk

  ios-build:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [create-release, ios-test]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
          key: ios-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build Rust library for iOS
        run: cargo build --release --target aarch64-apple-ios

      - name: Create XCFramework (iOS device only)
        run: |
          mkdir -p build/staging/ios
          cp target/aarch64-apple-ios/release/libsep_xxxx_circuits.a build/staging/ios/
          strip -S build/staging/ios/libsep_xxxx_circuits.a
          xcodebuild -create-xcframework \
            -library build/staging/ios/libsep_xxxx_circuits.a \
            -headers swift-mls/Sources/CSEPMLSFFI/include \
            -output build/SEPMLSFFI.xcframework

      - name: Populate .env defaults for CI
        run: |
          [ -f .env ] || cp .env.example .env
          [ -f relayer/.env ] || cp relayer/.env.example relayer/.env

      - name: Pre-generate RelayerDefaults for xcodegen
        run: |
          ENV_FILE="relayer/.env"
          ROOT_ENV=".env"
          OUT="clients/ios/StellarChat/StellarChat/RelayerDefaults.generated.swift"
          EP=""; CID=""; BIND=""; AUTH=""; DOMAIN=""
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                RELAYER_RPC_URL) EP="$val" ;;
                RELAYER_CONTRACT_ID) CID="$val" ;;
                RELAYER_BIND) BIND="$val" ;;
                RELAYER_AUTH_TOKENS) AUTH="${val%%,*}" ;;
              esac
            done < "$ENV_FILE"
          fi
          if [ -f "$ROOT_ENV" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                DOMAIN) DOMAIN="$val" ;;
              esac
            done < "$ROOT_ENV"
          fi
          NOSTR=""; BLOSSOM=""; RELAY=""
          if [ -n "$DOMAIN" ]; then
            NOSTR="wss://nostr.$DOMAIN"
            BLOSSOM="https://blossom.$DOMAIN"
            RELAY="https://relay.$DOMAIN"
          elif [ -n "$BIND" ]; then
            RELAY="http://$BIND"
          fi
          cat > "$OUT" << SWIFT
          // Auto-generated from .env + relayer/.env — do not edit
          enum RelayerDefaults {
              static let contractEndpoint = "$EP"
              static let contractID = "$CID"
              static let relayerURL = "$RELAY"
              static let relayerAuthToken = "$AUTH"
              static let defaultNostrRelay = "$NOSTR"
              static let defaultBlossomServer = "$BLOSSOM"
          }
          SWIFT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/StellarChat
        run: xcodegen generate

      - name: Configure SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF

      - name: Install Fastlane
        working-directory: clients
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build, upload to TestFlight, and export ad-hoc IPA
        working-directory: clients
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_TEAM_ID: ${{ secrets.MATCH_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bundle exec fastlane ios release

      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mv clients/build/ios/adhoc/StellarChat.ipa "StellarChat-${VERSION}.ipa"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: StellarChat-${{ steps.version.outputs.version }}.ipa

  publish-ota-manifest:
    runs-on: ubuntu-latest
    needs: ios-build
    concurrency:
      group: ota-manifest-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate OTA manifest + install page
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/generate-ota-manifest.sh "$VERSION"

      - name: Commit and push to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/website/ota/
          if git diff --cached --quiet; then
            echo "OTA manifest for v${VERSION} already up to date."
            exit 0
          fi
          git commit -m "ota: publish manifest for v${VERSION}"
          # CI also pushes altstore updates on the same branch. On push
          # contention, re-run the generator against fresh main so the root
          # index.html listing stays complete with any version dirs that were
          # added concurrently.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; resetting to origin/main and regenerating..."
            git fetch origin main
            git reset --hard origin/main
            bash scripts/generate-ota-manifest.sh "$VERSION"
            git add deploy/website/ota/
            if git diff --cached --quiet; then
              echo "After reset, no OTA changes left to publish for v${VERSION}."
              exit 0
            fi
            git commit -m "ota: publish manifest for v${VERSION}"
          done
          echo "failed to push OTA manifest for v${VERSION} after 3 attempts" >&2
          exit 1

  redeploy-ota:
    runs-on: ubuntu-latest
    needs: publish-ota-manifest
    concurrency:
      group: ota-redeploy-main
      cancel-in-progress: false
    steps:
      - name: Check redeploy secrets
        id: check
        env:
          HAS_KEY: ${{ secrets.DROPLET_SSH_KEY != '' }}
          HAS_IP: ${{ secrets.DROPLET_IP != '' }}
          HAS_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_IP" = "true" ] && [ "$HAS_HOST_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "DROPLET_SSH_KEY / DROPLET_IP / DROPLET_HOST_KEY not all set; skipping redeploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: main

      - name: Configure SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Pin the expected droplet host key (ed25519 / rsa line from
          # `ssh-keyscan -H <droplet-ip>` captured once by the operator and
          # stored as secret). This replaces runtime TOFU with an explicit
          # trust anchor.
          printf '%s\n' "$DROPLET_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/droplet
          chmod 600 ~/.ssh/droplet

      - name: Rsync OTA files to droplet
        if: steps.check.outputs.enabled == 'true'
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/droplet -o StrictHostKeyChecking=yes" \
            deploy/website/ota/ \
            "root@${DROPLET_IP}:/opt/onym-chat/deploy/website/ota/"

      - name: Upload nginx conf + reload if changed
        if: steps.check.outputs.enabled == 'true'
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          set -euo pipefail
          # Nginx conf rarely changes per release, but keep it in sync.
          # Static-file changes don't need a reload (bind mount); conf changes do.
          local_sha=$(sha256sum deploy/nginx/conf.d/onym.chat.conf | awk '{print $1}')
          remote_sha=$(ssh -i ~/.ssh/droplet "root@${DROPLET_IP}" \
            "sha256sum /opt/onym-chat/deploy/nginx/conf.d/onym.chat.conf 2>/dev/null | awk '{print \$1}'" \
            || echo "")
          if [ "$local_sha" = "$remote_sha" ]; then
            echo "nginx conf unchanged; no reload."
            exit 0
          fi
          echo "nginx conf changed; staging + validating + atomically swapping..."
          # 1. Upload to a staging filename alongside the live one. Nginx
          #    only reads files matching *.conf in /etc/nginx/conf.d/, so
          #    a *.conf.new filename is a harmless staging slot.
          rsync -az -e "ssh -i ~/.ssh/droplet" \
            deploy/nginx/conf.d/onym.chat.conf \
            "root@${DROPLET_IP}:/opt/onym-chat/deploy/nginx/conf.d/onym.chat.conf.new"
          # 2. Atomically swap + validate on the droplet. If the new conf
          #    fails `nginx -t`, restore the backup before any reload.
          ssh -i ~/.ssh/droplet "root@${DROPLET_IP}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/onym-chat
          cp deploy/nginx/conf.d/onym.chat.conf deploy/nginx/conf.d/onym.chat.conf.bak
          mv deploy/nginx/conf.d/onym.chat.conf.new deploy/nginx/conf.d/onym.chat.conf
          if docker compose exec -T nginx nginx -t; then
            docker compose exec -T nginx nginx -s reload
            rm -f deploy/nginx/conf.d/onym.chat.conf.bak
            echo "nginx reloaded with new config"
          else
            echo "ERROR: new nginx config failed validation, rolling back" >&2
            mv deploy/nginx/conf.d/onym.chat.conf.bak deploy/nginx/conf.d/onym.chat.conf
            exit 1
          fi
          REMOTE
