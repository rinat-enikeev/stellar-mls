name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md

  android-build:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Build deterministic APK in Docker
        run: |
          chmod +x scripts/build-fdroid-release.sh
          ./scripts/build-fdroid-release.sh

      - name: Zipalign APK
        run: |
          pip install repro-apk
          APK=$(ls app-fdroid-arm64-v8a-release-*.apk)
          mv "$APK" unaligned.apk
          repro-apk zipalign --page-size 16 --pad-like-apksigner --replace unaligned.apk "$APK"
          rm -f unaligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | sort -V | tail -1)
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            app-fdroid-arm64-v8a-release-*.apk
          rm /tmp/keystore.jks

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app-fdroid-arm64-v8a-release-*.apk

  ios-build:
    runs-on: macos-15
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
          key: ios-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build Rust library for iOS
        run: cargo build --release --target aarch64-apple-ios

      - name: Create XCFramework (iOS device only)
        run: |
          mkdir -p build/staging/ios
          cp target/aarch64-apple-ios/release/libsep_xxxx_circuits.a build/staging/ios/
          strip -S build/staging/ios/libsep_xxxx_circuits.a
          xcodebuild -create-xcframework \
            -library build/staging/ios/libsep_xxxx_circuits.a \
            -headers swift-mls/Sources/CSEPMLSFFI/include \
            -output build/SEPMLSFFI.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/StellarChat
        run: xcodegen generate

      - name: Configure SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF

      - name: Install Fastlane
        working-directory: clients
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build and upload to TestFlight
        working-directory: clients
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_TEAM_ID: ${{ secrets.MATCH_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bundle exec fastlane ios release
