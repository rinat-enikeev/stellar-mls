[package]
name = "sep-xxxx-circuits"
version = "0.1.0"
edition = "2021"
description = "Groth16 circuits for SEP-XXXX: Private Group Membership Registry with Zero-Knowledge Proof"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# --- BLS12-381 curve, fields, serialisation (used by both proving systems) ---
ark-bls12-381 = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"

# --- Groth16 stack (legacy; gated behind `feature = "groth16"`, kept in default) ---
ark-relations = { version = "0.4", optional = true }
ark-r1cs-std = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-snark = { version = "0.4", optional = true }
ark-crypto-primitives = { version = "0.4", features = ["crh", "merkle_tree", "sponge", "r1cs"], optional = true }

# --- TurboPlonk stack (jf-plonk + jf-pcs + jf-relation; gated behind `feature = "plonk"`) ---
# Espresso's jellyfish workspace is git-only; pinned to per-crate tag `jf-plonk-v0.8.0`
# (workspace revision b33995b6 as of 2026-04-30, also tagged `jf-relation-v0.5.0`).
# All three deps reference the same tag so Cargo resolves them to the same revision.
# Re-verify with `git ls-remote --tags https://github.com/EspressoSystems/jellyfish`
# before bumping.
jf-plonk    = { git = "https://github.com/EspressoSystems/jellyfish", tag = "jf-plonk-v0.8.0", default-features = false, features = ["std"], optional = true }
jf-pcs      = { git = "https://github.com/EspressoSystems/jellyfish", tag = "jf-plonk-v0.8.0", default-features = false, features = ["std"], optional = true }
jf-relation = { git = "https://github.com/EspressoSystems/jellyfish", tag = "jf-plonk-v0.8.0", default-features = false, features = ["std"], optional = true }

# --- General utility deps (unconditional) ---
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
k256 = { version = "0.13", features = ["schnorr"] }
jni = { version = "0.21", optional = true }

[dev-dependencies]
ark-relations = { version = "0.4", features = ["std"] }

[features]
# Default keeps Groth16 active so existing builds (mobile bundles, FFI surface,
# every test that exists today) work unchanged. Phase B.4 will split prover
# modules behind these feature gates; Phases C.2 / E will cut groth16 from default.
default = ["std", "jni", "ffi", "groth16"]
std = []
ffi = []
jni = ["dep:jni"]
groth16 = ["dep:ark-relations", "dep:ark-r1cs-std", "dep:ark-groth16", "dep:ark-snark", "dep:ark-crypto-primitives"]
plonk = ["dep:jf-plonk", "dep:jf-pcs", "dep:jf-relation"]

[profile.release]
strip = "symbols"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.release-ceremony]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
