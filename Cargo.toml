[package]
name = "sep-xxxx-circuits"
version = "0.1.0"
edition = "2021"
description = "Groth16 circuits for SEP-XXXX: Private Group Membership Registry with Zero-Knowledge Proof"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# Arkworks core: constraint system and relations
ark-relations = "0.4"
ark-r1cs-std = "0.4"

# BLS12-381 curve and field implementations
ark-bls12-381 = "0.4"

# Groth16 prover/verifier
ark-groth16 = "0.4"

# Algebra traits and serialization
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["crh", "merkle_tree", "sponge", "r1cs"] }
ark-snark = "0.4"

# SHA-256 for the outer commitment binding
sha2 = "0.10"

# Randomness
rand = "0.8"
rand_chacha = "0.3"
k256 = { version = "0.13", features = ["schnorr"] }

[dev-dependencies]
ark-relations = { version = "0.4", features = ["std"] }

[features]
default = ["std"]
std = []
