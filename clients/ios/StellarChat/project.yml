name: StellarChat
options:
  bundleIdPrefix: com.stellarmls
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

packages:
  SwiftMLS:
    path: ../../../swift-mls

targets:
  StellarChat:
    type: application
    platform: iOS
    sources:
      - StellarChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stellarmls.chat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SwiftMLS

  StellarChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StellarChatTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stellarmls.chat.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StellarChat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StellarChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: StellarChat
      - package: SwiftMLS
