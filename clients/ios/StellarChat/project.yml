name: StellarChat
options:
  bundleIdPrefix: chat.onym
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  SwiftMLS:
    path: ../../../swift-mls

targets:
  StellarChat:
    type: application
    platform: iOS
    sources:
      - StellarChat
      - path: StellarChat/Resources/keyset-v2
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.onym.ios
        INFOPLIST_KEY_CFBundleDisplayName: Onym
        MARKETING_VERSION: "1.10.60"
        CURRENT_PROJECT_VERSION: 104
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_ENTITLEMENTS: StellarChat/StellarChat.entitlements
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
    preBuildScripts:
      - name: Generate Relayer Defaults
        script: |
          ENV_FILE="${SRCROOT}/../../../relayer/.env"
          [ -f "$ENV_FILE" ] || ENV_FILE="${SRCROOT}/../../../relayer/.env.example"
          ROOT_ENV="${SRCROOT}/../../../.env"
          [ -f "$ROOT_ENV" ] || ROOT_ENV="${SRCROOT}/../../../.env.example"
          OUT="${SRCROOT}/StellarChat/RelayerDefaults.generated.swift"
          EP=""; CID=""; BIND=""; AUTH=""; DOMAIN=""
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                RELAYER_RPC_URL) EP="$val" ;;
                RELAYER_CONTRACT_ID) CID="$val" ;;
                RELAYER_BIND) BIND="$val" ;;
                RELAYER_AUTH_TOKENS) AUTH="${val%%,*}" ;;
              esac
            done < "$ENV_FILE"
          fi
          if [ -f "$ROOT_ENV" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in \#*|"") continue ;; esac
              key="${line%%=*}"; val="${line#*=}"
              val="${val%\"}"; val="${val#\"}"
              case "$key" in
                DOMAIN) DOMAIN="$val" ;;
              esac
            done < "$ROOT_ENV"
          fi
          NOSTR=""; BLOSSOM=""; RELAY=""
          if [ -n "$DOMAIN" ]; then
            NOSTR="wss://nostr.$DOMAIN"
            BLOSSOM="https://blossom.$DOMAIN"
            RELAY="https://relay.$DOMAIN"
          elif [ -n "$BIND" ]; then
            RELAY="http://$BIND"
          fi
          cat > "$OUT" << SWIFT
          // Auto-generated from .env + relayer/.env — do not edit
          enum RelayerDefaults {
              static let contractEndpoint = "$EP"
              static let contractID = "$CID"
              static let relayerURL = "$RELAY"
              static let relayerAuthToken = "$AUTH"
              static let defaultNostrRelay = "$NOSTR"
              static let defaultBlossomServer = "$BLOSSOM"
          }
          SWIFT
        outputFiles:
          - $(SRCROOT)/StellarChat/RelayerDefaults.generated.swift
    dependencies:
      - package: SwiftMLS
      - target: StellarChatNotificationService
        embed: true

  StellarChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StellarChatTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.onym.ios.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StellarChat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StellarChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: StellarChat
      - package: SwiftMLS

  StellarChatNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - StellarChatNotificationService
      - path: StellarChat/Models/PushSubscriptionStore.swift
      - path: StellarChat/Models/StorageEncryption.swift
      - path: StellarChat/Models/GroupCrypto.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.onym.ios.NotificationService
        MARKETING_VERSION: "1.10.60"
        CURRENT_PROJECT_VERSION: 104
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StellarChatNotificationService/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NOTIFICATION_SERVICE_EXTENSION
    entitlements:
      path: StellarChatNotificationService/StellarChatNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.chat.onym.ios
    dependencies: []

schemes:
  StellarChat:
    build:
      targets:
        StellarChat: all
        StellarChatTests: [test]
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
      targets:
        - StellarChatTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
