appId: ${APP_ID}
name: store-screenshots
---
# Capture five screens in one flow:
#   01-chats     — populated chat list (demo seed)
#   02-chat      — open conversation with messages
#   03-create    — "create group" sheet
#   04-settings  — settings screen
#
# All taps use visible-text matchers so the same flow works on both
# iOS and Android (labels are identical across platforms).

- launchApp:
    arguments:
      demo: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-chats

- tapOn: "Climbing Crew"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-chat
- back
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 03-settings
