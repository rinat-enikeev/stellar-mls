appId: ${APP_ID}
name: store-screenshots
---
# Capture five screens. Between chat-detail screens we relaunch the app
# (demo data re-seeds deterministically) instead of fighting the iOS
# back gesture, which Maestro can't reliably trigger on this UI.
#   01-chats     — populated chat list (demo seed)
#   02-chat      — Climbing Crew conversation
#   03-family    — Family conversation
#   04-settings  — settings tab
#   05-contacts  — contacts tab
#
# Before each takeScreenshot we assert content unique to that screen is
# visible, so the screenshot waits on real layout — Android's list
# fade-in finishes *after* waitForAnimationToEnd reports done, which
# was capturing mid-fade.

- launchApp:
    arguments:
      demo: true
- assertVisible: "Climbing Crew"
- assertVisible: "Family"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-chats

- tapOn: "Climbing Crew"
- assertVisible: "I'll bring the chalk"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-chat

- launchApp:
    arguments:
      demo: true
- assertVisible: "Family"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Family"
- assertVisible: "Bringing dessert!"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-family

- launchApp:
    arguments:
      demo: true
- assertVisible: "Climbing Crew"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04-settings

- tapOn: "Contacts"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05-contacts
