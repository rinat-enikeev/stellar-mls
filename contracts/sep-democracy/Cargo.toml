[package]
name = "sep-democracy-contract"
version = "0.1.0"
edition = "2021"
description = "Soroban smart contract for SEP Democracy: per-type private group with hidden member counts via occupancy commitment, configurable quorum threshold."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=25.3.0"

[dev-dependencies]
soroban-sdk = { version = "=25.3.0", features = ["testutils"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
