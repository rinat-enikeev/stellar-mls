[package]
name = "ceremony-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-side verifier for the Onym trusted setup ceremony transcript"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sep-xxxx-circuits = { path = "../..", default-features = false, features = ["std"] }

ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Transitive deps of the main crate (rand, k256) pull getrandom; the
# wasm32-unknown-unknown target needs the "js" feature enabled to bind
# to crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }

# Better error messages from panics in the browser console.
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

# Modern rustc emits bulk-memory / reference-types ops which the wasm-opt
# version bundled with older wasm-pack cannot validate. We pass the enable
# flags explicitly so the size-optimized pass goes through.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-mutable-globals", "--enable-sign-ext"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
