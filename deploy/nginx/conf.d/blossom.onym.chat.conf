server {
    listen 443 ssl;
    http2 on;
    server_name blossom.onym.chat;

    ssl_certificate /etc/letsencrypt/live/onym.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onym.chat/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Allow large media uploads (images, videos)
    client_max_body_size 100M;

    set $upstream_blossom blossom:3000;

    location / {
        proxy_pass http://$upstream_blossom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large upload timeouts (videos can take a while)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
