server {
    listen 443 ssl;
    http2 on;
    server_name ceremony.onym.chat;

    ssl_certificate /etc/letsencrypt/live/onym.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onym.chat/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Phase 2 zkey uploads can be large; Phase 1 state.srs tops out well under
    # 100 MB for the "large" tier but we add headroom.
    client_max_body_size 220M;
    client_body_buffer_size 1m;

    set $upstream_ceremony ceremony-coordinator:9090;

    root /var/www/ceremony;
    index index.html;

    # Browser WASM verifier. Serve with the correct MIME type so browsers
    # use streaming instantiation (WebAssembly.instantiateStreaming) and
    # aggressively cache — the bundle is content-addressed by commit hash
    # via the release workflow, safe to cache for a long time.
    location /wasm/ {
        default_type application/wasm;
        types {
            application/wasm wasm;
            application/javascript js;
            text/plain d.ts;
        }
        add_header Cache-Control "public, max-age=3600";
        add_header Cross-Origin-Resource-Policy "same-origin";
        try_files $uri =404;
    }

    # Static frontend (SPA-ish; serve .html without extension).
    # HTML/JS/CSS here are mutable and get pushed as part of releases, so we
    # tell browsers to revalidate every load (cheap — the ETag short-circuits
    # the body on 304). Without this, hard-reloads were needed after ships.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API surface. NIP-98 auth is handled inside the coordinator; we don't
    # add anything here besides the usual forwarded headers.
    location /api/ {
        proxy_pass http://$upstream_ceremony;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE support: disable buffering and keep the connection open far
        # longer than the default 60s. The /status/stream endpoint sends a
        # synthetic keep-alive every 15 s, but aggressive proxies still close
        # idle long-poll connections if read_timeout is short.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_request_buffering off;
    }

    # Health probe bypasses logs.
    location = /api/v1/healthz {
        proxy_pass http://$upstream_ceremony;
        access_log off;
    }
}
