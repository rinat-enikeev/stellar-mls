server {
    listen 443 ssl;
    http2 on;
    server_name onym.chat;

    ssl_certificate /etc/letsencrypt/live/onym.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onym.chat/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    root /var/www/website;
    index index.html;

    location /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # PR debug build landing pages (published by the /build android n8n flow).
    # Backed by /opt/onym-chat-builds on the host; not part of the site root
    # to survive deploy.sh redeploys.
    location /build/ {
        alias /var/www/builds/;
        index index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/ota/.*\.plist$ {
        default_type application/xml;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
