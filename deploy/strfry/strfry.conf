##
## strfry configuration for onym.chat Nostr relay
##

# Database settings
db {
    path = "/app/strfry-db/"
    maxreaders = 256
    mapsize = 1099511627776  # 1 TB (virtual, actual disk usage is much smaller)
}

# Relay settings
relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 1000000

    # Relay info (NIP-11)
    info {
        name = "onym.chat relay"
        description = "Private group chat relay for onym.chat"
        contact = ""
        icon = ""
    }

    # Maximum WebSocket message size (bytes)
    maxWebsocketPayloadSize = 131072  # 128 KB

    # Reject events older than this (seconds)
    maxFilterLimit = 500

    # Authentication
    autoPingSeconds = 55
    enableTcpKeepalive = false

    # Write policy
    writePolicy {
        # No plugin = accept all events
        plugin = ""
    }

    # Compression
    compression {
        enabled = true
        slidingWindow = true
    }

    # NIP-42 authentication (disabled — open relay for the app)
    realIpHeader = "X-Real-IP"

    # Event limits
    maxEventSize = 65536  # 64 KB per event
}

# Event expiration
events {
    maxNumTags = 2000
    maxTagValSize = 1024
}
