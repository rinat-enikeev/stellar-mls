<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onym OTA — releases</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 520px;
            margin: 0 auto;
            padding: 48px 24px;
            color: #1c1c1e;
            background: #f2f2f7;
        }
        h1 { font-size: 24px; margin: 0 0 4px; text-align: center; }
        p.sub { color: #6e6e73; font-size: 15px; text-align: center; margin: 0 0 32px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { margin: 0 0 8px; }
        li a {
            display: block;
            background: #fff;
            color: #1c1c1e;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        li a:active { background: #eceef3; }
        .badge {
            display: inline-block;
            background: #6c5ce7;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 8px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .note {
            margin-top: 24px;
            padding: 16px;
            background: #fff;
            border-radius: 12px;
            font-size: 14px;
            color: #3c3c43;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Onym</h1>
    <p class="sub">Ad-hoc iOS releases</p>
    <ul>
        <li><a href="/ota/1.10.2/">Version 1.10.2 <span class="badge">latest</span></a></li>
    </ul>
    <div class="note">
        Open this page in <strong>Safari on iOS</strong>. Installation requires the device UDID to be in the ad-hoc provisioning profile used to sign the chosen build.
    </div>
</body>
</html>
