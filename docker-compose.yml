name: onym

services:
  relayer:
    build:
      context: ./relayer
      dockerfile: Dockerfile
    env_file: ./relayer/.env
    environment:
      - RELAYER_BIND=0.0.0.0:8080
    restart: unless-stopped
    networks:
      - internal

  nostr-relay:
    image: dockurr/strfry:latest
    volumes:
      - ./deploy/strfry/strfry.conf:/etc/strfry.conf:ro
      - strfry-data:/app/strfry-db
    restart: unless-stopped
    networks:
      - internal

  pn-relay:
    build:
      context: ./pn-relay
      dockerfile: Dockerfile
    environment:
      - PN_BIND=0.0.0.0:8090
      - PN_NOSTR_RELAY=ws://nostr-relay:7777
      - PN_DATA_DIR=/app/data
    env_file: ./pn-relay/.env
    volumes:
      - pn-relay-data:/app/data
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - nostr-relay

  blossom:
    image: ghcr.io/hzrd149/blossom-server:latest
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      - blossom-data:/app/data
      - ./deploy/blossom/config.yml:/app/config.yml:ro
    restart: unless-stopped
    networks:
      - internal

  ceremony-coordinator:
    build:
      context: .
      dockerfile: ceremony-coordinator/Dockerfile
    env_file:
      - path: ./ceremony-coordinator/.env
        required: false
    environment:
      - CEREMONY_BIND=0.0.0.0:9090
      - CEREMONY_DB_PATH=/data/ceremony.sqlite
      - CEREMONY_BLOSSOM_URL=https://blossom.onym.chat
      - CEREMONY_BLOSSOM_PUBLIC_URL=https://blossom.onym.chat
      - CEREMONY_NOSTR_RELAY=ws://nostr-relay:7777
      - CEREMONY_TOOL_BIN=/usr/local/bin/ceremony_tool
      - CEREMONY_WORK_DIR=/data/work
      - CEREMONY_DOWNLOADS_MANIFEST=/data/ceremony-downloads.json
      - RUST_LOG=ceremony_coordinator=info,tower_http=info
    volumes:
      - ceremony-data:/data
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - blossom
      - nostr-relay

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./deploy/website:/var/www/website:ro
      - ./deploy/ceremony:/var/www/ceremony:ro
      # PR debug build landing pages published by the /build android n8n flow.
      # Lives outside deploy/ so deploy.sh's `rm -rf deploy` doesn't wipe it.
      - /opt/onym-chat-builds:/var/www/builds:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - internal

volumes:
  strfry-data:
  pn-relay-data:
  blossom-data:
  ceremony-data:
  certbot-webroot:
  certbot-certs:

networks:
  internal:
    driver: bridge
